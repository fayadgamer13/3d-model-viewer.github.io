<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic 3D Model Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Control UI Overlay -->
    <div id="ui-container">
        <h1>3D Model Viewer</h1>
        <label for="file-upload" class="custom-file-upload">
            📁 Choose Any .gltf / .glb File
        </label>
        <input type="file" id="file-upload" accept=".gltf, .glb" />
    </div>

    <!-- Container for the 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Import Three.js and GLTFLoader using ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
